name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same PR or branch supersedes the running checks.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  verify:
    # Pinned so the next ubuntu-latest move is an explicit, reviewed change.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --coverage
      - run: npm run db:migrate && npm run db:seed
      - name: Restore Next.js build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          # Exact hit when deps and sources are unchanged; otherwise reuse the latest cache for the same deps.
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.ts', 'tsconfig.json') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm run build

  supply-chain:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # Install scripts are not needed to audit or describe the dependency tree.
      - run: npm ci --ignore-scripts
      - name: Audit production dependencies (fails on high or critical)
        run: npm audit --omit=dev --audit-level=high
      - name: Verify registry signatures and provenance attestations
        run: npm audit signatures
      - name: Generate software bill of materials (CycloneDX)
        run: npm sbom --omit=dev --sbom-format=cyclonedx --sbom-type=application > sbom.cdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.cdx.json
          if-no-files-found: error
